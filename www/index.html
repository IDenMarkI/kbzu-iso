<script>
const $=s=>document.querySelector(s),R=Math.round,r1=x=>Math.round(x*10)/10;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const MN=['Сніданок','Обід','Вечеря','Перекус'],MI=['🌅','🍲','🌙','🍎'];
const MO=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'],WD=['нд','пн','вт','ср','чт','пт','сб'];
let S;try{S=JSON.parse(localStorage.getItem('kbzhu'))}catch(e){}
S=S||{log:{},custom:[],prof:{sex:'m',age:30,h:175,w:75,act:1.45,aim:0},goal:null};

function calc(){const p=S.prof,w=p.w,bf=+p.bf||0,lb=bf>0&&bf<60?w*(1-bf/100):0,m=p.sex=='m';
const bmr=lb?370+21.6*lb:10*w+6.25*p.h-5*p.age+(m?5:-161);
const k=R(Math.max(bmr*p.act*(1+p.aim),m?1500:1200)),pk=p.aim<0?2:p.aim>0?1.8:1.6,pr=R(Math.min(w*pk,.35*k/4)),f=R(Math.max(.8*w,.25*k/9));
S.goal={bmr:R(bmr),k,p:pr,f,v:Math.max(0,R((k-4*pr-9*f)/4)),w:R(w*33/50)*50+(p.act>=1.55?500:0),m:{fi:R(14*k/1000),su:R(.1*k/4),sf:R(.1*k/9),na:2000,ca:(!m&&p.age>50)?1200:1000,fe:(!m&&p.age<51)?18:8,po:3500,mg:p.age<31?(m?400:310):(m?420:320)}}}
S.water=S.water||{};S.mc=S.mc||{};S.hc=S.hc||{};S.rep=S.rep||{};
S.prof.act=[1.2,1.375,1.55,1.725,1.9].reduce((a,b)=>Math.abs(b-S.prof.act)<Math.abs(a-S.prof.act)?b:a);
if(Math.abs(S.prof.aim)>1)S.prof.aim=S.prof.aim<0?-.2:S.prof.aim>0?.1:0;
if(!S.goal||!S.goal.m)calc();
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const tot=es=>es.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,f:a.f+e.f,v:a.v+e.v}),{k:0,p:0,f:0,v:0});
const MD=[['fi','Клітковина','г',1,'🌿'],['su','Цукор','г',0,'🍬'],['sf','Насичені жири','г',0,'🥓'],['na','Натрій','мг',0,'🧂'],['ca','Кальцій','мг',1,'🦴'],['fe','Залізо','мг',1,'🩸'],['po','Калій','мг',1,'🍌'],['mg','Магній','мг',1,'⚡']];
const sx=(x,f)=>{if(!x)return null;const o={};for(const k in x)if(x[k]!=null&&!isNaN(x[k]))o[k]=r1(x[k]*f);return Object.keys(o).length?o:null};
const getX=it=>(it.x&&sx(it.x,1)&&it.x)||(S.mc||{})[it.n]||null;
const mx=n=>{const g=(a,m)=>n[a]==null?undefined:r1(n[a]*(m||1)),na=n.sodium_100g!=null?n.sodium_100g:(n.salt_100g!=null?n.salt_100g/2.5:null);return{fi:g('fiber_100g'),su:g('sugars_100g'),sf:g('saturated-fat_100g'),na:na==null?undefined:R(na*1000),ca:g('calcium_100g',1000),fe:g('iron_100g',1000),po:g('potassium_100g',1000),mg:g('magnesium_100g',1000)}};
const DR=/(?:^|[^\p{L}])(?:чай|чаю|чаї|чаєм|кава|кави|каву|кавою|кофе|еспресо|американо|капучино|латте|лате|мокко|мокачино|раф|макіато|флет-?вайт|матча|coffee|tea|espresso|latte|cappuccino|americano|mocha|matcha)(?![\p{L}])/iu,DX=/печив|торт|цукерк|десерт|морозив|желе|драже|батончик|шоколад|йогурт|вафл|круасан|кекс|пиріж|зерн|мелен|сироп/i;
const isDr=e=>DR.test(e.n||'')&&!DX.test(e.n||'');
const wdr=d=>(S.log[dk(d)]||[]).reduce((a,e)=>a+(isDr(e)?(+e.g||0):0),0);
const wtot=d=>(S.water[dk(d)]||0)+wdr(d);
const wa=days=>{const a=days.map(o=>wtot(o.d||new Date())).filter(Boolean);return a.length?R(a.reduce((x,y)=>x+y)/a.length):0};
const fa=lg=>{const a=lg.map(o=>o.es.reduce((s,e)=>s+((e.x&&e.x.fi)||0),0)).filter(Boolean);return a.length?r1(a.reduce((x,y)=>x+y)/a.length):0};
function aw(n){S.water[dk(day)]=Math.max(0,(S.water[dk(day)]||0)+n);save();buzz();render()}
let mOpen=false;

function micro(es){const m=S.goal.m,s={};MD.forEach(d=>s[d[0]]=0);es.forEach(e=>e.x&&MD.forEach(d=>s[d[0]]+=e.x[d[0]]||0));

grid=mOpen?`<div class="card" data-mg="1" style="margin-top:0"><div class="mh" onclick="tgMin()"><b>Мікроелементи</b><small>за день · тап — згорнути</small></div><div class="mg">${MD.map(d=>{const v=s[d[0]],mx=m[d[0]],ov=!d[3]&&v>mx,p=Math.min(100,mx?v/mx*100:0);return `<div class="mi${ov?' ov':''}"><div class="mn"><span>${d[4]}</span>${d[1]}</div><b>${r1(v)}<i> / ${mx} ${d[2]}</i></b><div class="bar"><u class="${ov?'o':'m'}" data-w="${p}"></u></div><small>${d[3]?'норма':'не більше'}</small></div>`}).join('')}</div></div>`:'';
return chips+grid}
function water(){const dr=wdr(day),w=wtot(day),g=S.goal.w;return `<div class="card"><div class="mh"><span>💧 <b>Вода</b></span><small>${w} / ${g} мл</small></div>${dr?`<small style="display:block;margin-top:4px">у т. ч. чай і кава з харчування: ${dr} мл</small>`:''}<div class="bar" style="margin-top:10px"><u style="background:#38bdf8" data-w="${Math.min(100,w/g*100)}"></u></div><div class="wb"><button onclick="aw(150)">+150</button><button onclick="aw(250)">+250</button><button onclick="aw(500)">+500</button><button onclick="aw(-250)">−250</button></div></div>`}
const gm=()=>{const m=S.goal.m;return `<div class="card"><b>Норми води та мікроелементів</b><small> (позначені «макс» не перевищувати)</small><br><br><div class="f2">${inp('Вода, мл','w',S.goal.w,'sg')}${MD.map(d=>inp(d[1]+', '+d[2]+(d[3]?'':' (макс)'),d[0],m[d[0]],'sgm')).join('')}</div></div>`};
function sgm(k,v){S.goal.m[k]=+v;save()}
const fixK=x=>{const c=4*x.p+9*x.f+4*x.v;if(c>20&&Math.abs(x.k-c)>.2*c&&!/пив|вин|горілк|віскі|алкогол|коктейл|шампан|лікер/i.test(x.n))x.k=R(c);return x};
let view='t',per='w',day=new Date(),sh=null,rs=0;
const lab=d=>dk(d)==dk(new Date())?'Сьогодні':d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear();

const pw=same?q('[data-w]').map(e=>e.style.width):[],ph=same?q('[data-h]').map(e=>e.style.height):[],pn=same?q('[data-n]').map(e=>e.textContent):[];

if(same){const a=q('[data-w]'),b=q('[data-h]'),c=q('[data-n]');if(a.length==pw.length)a.forEach((e,i)=>e.style.width=pw[i]);if(b.length==ph.length)b.forEach((e,i)=>e.style.height=ph[i]);if(c.length==pn.length)c.forEach((e,i)=>e.dataset.f=pn[i])}
$('#aibar').style.display=view=='t'?'flex':'none';{const m=$('#mic');if(m)m.style.display=NAT()?'':'none'}
