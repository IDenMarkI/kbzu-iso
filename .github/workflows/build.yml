name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYB64: 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (full with Health Connect, fallback to safe)
        run: |
          bash build.sh full || { echo "::warning::FULL build failed, building SAFE (no Health Connect)"; bash build.sh safe; }
      - uses: actions/upload-artifact@v4
        with:
          name: kbzhu-apk
          path: out/*.apk
